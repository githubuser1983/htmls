<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run TM</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3f3f3;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}a{color:#8ab4ff}h1{font-size:22px}h2{font-size:18px;margin-top:24px}.card{background:#181818;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,.btn{border:0;border-radius:12px;background:#2f6fed;color:#fff;padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block;touch-action:manipulation}button.secondary,.btn.secondary{background:#444}button.danger{background:#8b2f2f}button:disabled{opacity:.45}input[type=file],input[type=text],textarea{width:100%;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:120px}small,.muted{color:#aaa}.good{color:#8ee29b}.err{color:#ff9a9a}code{background:#222;padding:2px 5px;border-radius:5px}.tape{overflow:auto;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#080808;border-radius:10px;padding:10px;margin:7px 0}.head{background:#fff;color:#111;border-radius:4px;padding:1px 3px}.hidden{display:none!important}.tinwrap{margin:8px 0}.busy{opacity:.8}pre{white-space:pre-wrap;overflow:auto}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#2a2a2a;margin:2px 4px 2px 0;font-size:13px}</style></head><body><main>
<h1>Run TM</h1><div class="card"><input id="file" type="file" accept=".tm,.gz,.tm.gz"><div id="loadstatus" class="muted">TM-Datei laden oder eine vorkompilierte Maschine von der Startseite öffnen.</div></div><div id="info" class="card hidden"></div>
<div id="textUI" class="hidden"><div class="card"><textarea id="textTape" spellcheck="false" autocapitalize="off"></textarea><div class="row" style="margin-top:10px"><button data-out="1">+1</button><button data-out="10">+10</button><button data-out="100">+100</button></div><div id="textState" class="muted"></div></div></div>
<div id="tableUI" class="hidden"><div class="card" id="tapeInputs"></div><div class="card"><div class="row"><button data-step="1">+1</button><button data-step="10">+10</button><button data-step="100">+100</button><button id="halt" class="secondary">Bis HALT</button><button id="stop" class="danger" disabled>Stop</button></div><div id="genState" class="muted"></div><div id="tapeViews"></div></div></div>
<div id="denseUI" class="hidden"><div class="card"><p class="muted">Generischer TMR5-ReLU-Evaluator. Zahlen als Komma- oder Leerzeichenliste eingeben.</p><textarea id="denseInput" placeholder="0, 1, 0, ..."></textarea><div class="row" style="margin-top:10px"><button id="denseEval">Netz auswerten</button></div><pre id="denseOutput"></pre></div></div>
<div class="row"><a class="btn secondary" href="index.html">Zurück</a></div>
<script>
const file=document.getElementById('file'),loadstatus=document.getElementById('loadstatus'),info=document.getElementById('info'),textUI=document.getElementById('textUI'),tableUI=document.getElementById('tableUI'),denseUI=document.getElementById('denseUI'),textTape=document.getElementById('textTape'),textState=document.getElementById('textState'),tapeInputs=document.getElementById('tapeInputs'),tapeViews=document.getElementById('tapeViews'),genState=document.getElementById('genState'),haltBtn=document.getElementById('halt'),stopBtn=document.getElementById('stop'),denseInput=document.getElementById('denseInput'),denseEval=document.getElementById('denseEval'),denseOutput=document.getElementById('denseOutput');let meta=null,arch=0,worker=null,genericDirty=true,busy=false;
function html(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function ungzip(buf){const u=new Uint8Array(buf);if(u[0]===0x1f&&u[1]===0x8b){if(!globalThis.DecompressionStream)throw Error('DecompressionStream fehlt; bitte aktuelles Chrome/Chromium verwenden.');return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}return buf}
function peek(buf){const u=new Uint8Array(buf),dv=new DataView(buf),magic=String.fromCharCode(...u.slice(0,4)),td=new TextDecoder(),ml=dv.getUint32(20,true),m=JSON.parse(td.decode(u.slice(24,24+ml)));if(magic==='TMR4')return {arch:1,meta:m,N:u[6],V:u[7],top:dv.getFloat32(16,true)};if(magic==='TMR3')return {arch:2,meta:m,T:u[6],V:u[7]};if(magic==='TMR5')return {arch:3,meta:m,inputDim:dv.getUint32(8,true),outputDim:dv.getUint32(12,true),layers:dv.getUint32(16,true)};throw Error('Unbekanntes Modellformat.')}
const workerCode=String.raw`
let model=null,M=null,cancel=false;
function argmax(a){let k=0;for(let i=1;i<a.length;i++)if(a[i]>a[k])k=i;return k}
function parse(buf){const u=new Uint8Array(buf),dv=new DataView(buf),magic=String.fromCharCode(...u.slice(0,4)),td=new TextDecoder(),ml=dv.getUint32(20,true),meta=JSON.parse(td.decode(u.slice(24,24+ml)));let p=24+ml;if(magic==='TMR4'){const N=u[6],V=u[7],R=dv.getUint32(8,true),L=dv.getUint32(12,true),top=dv.getFloat32(16,true),A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}const globalOut=u[p++],counts=new Uint32Array(N+1),bases=new Uint32Array(N+1);for(let k=1;k<=N;k++){counts[k]=dv.getUint32(p,true);p+=4}let b=p;for(let k=1;k<=N;k++){bases[k]=b;b+=counts[k]*(k+1)}return {arch:1,N,V,R,L,top,meta,A,globalOut,counts,bases,u}}if(magic==='TMR3'){const T=u[6],V=u[7],S=dv.getUint32(8,true),R=dv.getUint32(12,true),start=dv.getUint32(16,true),A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}const hc=dv.getUint16(p,true);p+=2;const halts=new Set();for(let i=0;i<hc;i++){halts.add(dv.getUint32(p,true));p+=4}const names=[];for(let i=0;i<S;i++){const z=dv.getUint16(p,true);p+=2;names.push(td.decode(u.slice(p,p+z)));p+=z}const offs=new Uint32Array(S+1);for(let i=0;i<=S;i++){offs[i]=dv.getUint32(p,true);p+=4}return {arch:2,T,V,S,R,start,meta,A,halts,names,offs,u,rows:p,rowSize:4+3*T}}if(magic==='TMR5'){const inputDim=dv.getUint32(8,true),outputDim=dv.getUint32(12,true),layerCount=dv.getUint32(16,true),V=dv.getUint16(p,true);p+=2;const N=dv.getUint16(p,true);p+=2,pad=dv.getUint16(p,true);p+=2;p+=2;const A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}const layers=[];for(let li=0;li<layerCount;li++){const inn=dv.getUint32(p,true);p+=4;const out=dv.getUint32(p,true);p+=4;const act=u[p++];p+=3;const W=new Float32Array(inn*out),b=new Float32Array(out);for(let i=0;i<W.length;i++){W[i]=dv.getFloat32(p,true);p+=4}for(let i=0;i<b.length;i++){b[i]=dv.getFloat32(p,true);p+=4}layers.push({inn,out,act,W,b})}return {arch:3,inputDim,outputDim,layerCount,V,N,pad,A,layers,meta}}throw Error('Unbekanntes Modellformat.')}
function lookupText(k,ctx){const m=model,u=m.u,base=m.bases[k],rs=k+1;let lo=0,hi=m.counts[k]-1;while(lo<=hi){const mid=(lo+hi)>>>1,o=base+mid*rs;let cmp=0;for(let j=0;j<k;j++){const d=u[o+j]-ctx[ctx.length-k+j];if(d){cmp=d;break}}if(!cmp)return u[o+k];if(cmp<0)lo=mid+1;else hi=mid-1}return -1}
function runText(prompt,n){const sm=new Map(model.A.map((x,i)=>[x,i])),ctx=[],chars=Array.from(prompt);let steps=0;for(const c of chars){const id=sm.get(c);if(id===undefined)throw Error('Zeichen nicht im TM-Alphabet: '+JSON.stringify(c));ctx.push(id);if(ctx.length>model.N)ctx.shift();steps++}let used=0;for(let g=0;g<n;g++){let out=-1,order=0;for(let k=Math.min(model.N,ctx.length);k>=1;k--){out=lookupText(k,ctx);if(out>=0){order=k;break}}if(out<0){out=model.globalOut;order=0}chars.push(model.A[out]);ctx.push(out);if(ctx.length>model.N)ctx.shift();steps++;used=order}return {text:chars.join(''),steps,usedOrder:used}}
function denseForward(vec){let x=vec;for(const L of model.layers){if(x.length!==L.inn)throw Error('Falsche Eingabedimension: erwartet '+L.inn+', erhalten '+x.length);const y=new Float32Array(L.out);for(let j=0;j<L.out;j++){let s=L.b[j],base=j*L.inn;for(let i=0;i<L.inn;i++)s+=L.W[base+i]*x[i];y[j]=L.act?(s>0?s:0):s}x=y}return x}
function encodeLearnedContext(chars){const sm=new Map(model.A.map((x,i)=>[x,i])),x=new Float32Array(model.inputDim),ids=[];for(const c of chars){const id=sm.get(c);if(id===undefined)throw Error('Zeichen nicht im TM-Alphabet: '+JSON.stringify(c));ids.push(id)}for(let p=0;p<model.N;p++){const src=ids.length-model.N+p,id=src<0?model.pad:ids[src],ix=p*(model.V+1)+id;if(ix>=x.length)throw Error('Ungültige TMR5-Kontexteinstellung.');x[ix]=1}return x}
function runLearnedText(prompt,n){let chars=Array.from(prompt);for(let g=0;g<n;g++){const x=encodeLearnedContext(chars),logits=denseForward(x),out=argmax(logits);chars.push(model.A[out])}return {text:chars.join(''),steps:n,widths:model.layers.slice(0,-1).map(L=>L.out)}}
function resetGeneric(tapes){const sm=new Map(model.A.map((x,i)=>[x,i]));M={state:model.start,heads:Array(model.T).fill(0),tapes:[],steps:0,halt:false,sm};for(let t=0;t<model.T;t++){const mp=new Map(),s=Array.from(tapes[t]||'');for(let i=0;i<s.length;i++)mp.set(i,s[i]);M.tapes.push(mp)}}
function findRow(read){const m=model,u=m.u;let lo=m.offs[M.state],hi=m.offs[M.state+1]-1;while(lo<=hi){const mid=(lo+hi)>>>1,o=m.rows+mid*m.rowSize;let cmp=0;for(let j=0;j<m.T;j++){const d=u[o+j]-read[j];if(d){cmp=d;break}}if(!cmp)return o;if(cmp<0)lo=mid+1;else hi=mid-1}return -1}
function stepGeneric(){if(M.halt)return false;const blank=model.meta.blank,read=[];for(let t=0;t<model.T;t++){const c=M.tapes[t].get(M.heads[t])??blank,id=M.sm.get(c);if(id===undefined)throw Error('Bandsymbol nicht im Alphabet: '+c);read.push(id)}const o=findRow(read);if(o<0){M.halt=true;return false}let p=o+model.T,dv=new DataView(model.u.buffer,model.u.byteOffset,model.u.byteLength),ns=dv.getUint32(p,true);p+=4,wr=[],mv=[];for(let t=0;t<model.T;t++)wr.push(model.u[p++]);for(let t=0;t<model.T;t++)mv.push(model.u[p++]);for(let t=0;t<model.T;t++){const c=model.A[wr[t]];if(c===blank)M.tapes[t].delete(M.heads[t]);else M.tapes[t].set(M.heads[t],c);if(mv[t]===1)M.heads[t]++;else if(mv[t]===2)M.heads[t]--}M.state=ns;M.steps++;if(model.halts.has(ns))M.halt=true;return true}
function snapshot(){const views=[];for(let t=0;t<model.T;t++){const h=M.heads[t],lo=h-12,hi=h+12,cells=[];for(let i=lo;i<=hi;i++)cells.push(M.tapes[t].get(i)??model.meta.blank);views.push({h,lo,cells})}return {state:M.state,stateName:model.names[M.state]||('q'+M.state),steps:M.steps,halt:M.halt,views}}
async function runGeneric(count,until){cancel=false;let done=0,last=performance.now();const limit=until?50000000:count;while(!M.halt&&!cancel&&done<limit){if(!stepGeneric())break;done++;const now=performance.now();if(now-last>25){postMessage({kind:'progress',snap:snapshot()});last=now;await new Promise(r=>setTimeout(r,0))}}postMessage({kind:'genericDone',snap:snapshot(),cancelled:cancel})}
onmessage=async ev=>{try{const x=ev.data;if(x.cmd==='load'){model=parse(x.buf);postMessage({kind:'loaded',arch:model.arch,task:model.meta.task_kind||'',inputDim:model.inputDim||0,outputDim:model.outputDim||0})}else if(x.cmd==='text'){if(model.arch===1)postMessage({kind:'textDone',mode:'TMR4',...runText(x.prompt,x.n)});else if(model.arch===3&&model.meta.task_kind==='text_next_char')postMessage({kind:'textDone',mode:'TMR5',...runLearnedText(x.prompt,x.n)});else throw Error('Dieses Modell besitzt keinen Text-Adapter.')}else if(x.cmd==='denseEval'){if(model.arch!==3)throw Error('Kein TMR5-ReLU-Netz geladen.');const a=String(x.text).trim().split(/[\s,;]+/).filter(Boolean).map(Number);if(a.some(v=>!Number.isFinite(v)))throw Error('Ungültige Zahl in der Eingabe.');const y=denseForward(Float32Array.from(a));postMessage({kind:'denseDone',values:Array.from(y),argmax:argmax(y)})}else if(x.cmd==='resetGeneric'){resetGeneric(x.tapes);postMessage({kind:'genericDone',snap:snapshot()})}else if(x.cmd==='runGeneric'){if(x.tapes)resetGeneric(x.tapes);await runGeneric(x.n||0,!!x.until)}else if(x.cmd==='stop')cancel=true}catch(e){postMessage({kind:'error',message:String(e.message||e)})}};
`;
function makeWorker(){if(worker)worker.terminate();worker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'})));worker.onmessage=onWorker}
function setBusy(v){busy=v;document.querySelectorAll('button[data-out],button[data-step],#halt,#denseEval').forEach(b=>b.disabled=v);stopBtn.disabled=!v}
function onWorker(ev){const x=ev.data;if(x.kind==='textDone'){textTape.value=x.text;textTape.scrollTop=textTape.scrollHeight;textState.textContent=x.mode==='TMR5'?`gelernte dichte ReLU · ${x.steps} neue Zeichen · Hidden ${x.widths.join('–')}`:`TM-Schritte ${x.steps} · letzter verwendeter Kontext ${x.usedOrder}`;setBusy(false)}else if(x.kind==='denseDone'){const shown=x.values.slice(0,64).map((v,i)=>`${i}: ${v.toFixed(6)}`).join('\n');denseOutput.textContent=`argmax = ${x.argmax}\n${shown}${x.values.length>64?'\n…':''}`;setBusy(false)}else if(x.kind==='progress'){renderSnap(x.snap)}else if(x.kind==='genericDone'){renderSnap(x.snap);genericDirty=false;setBusy(false)}else if(x.kind==='error'){loadstatus.textContent='Fehler: '+x.message;setBusy(false)}}
async function loadBuffer(ab){const raw=await ungzip(ab),pk=peek(raw);meta=pk.meta;arch=pk.arch;makeWorker();worker.postMessage({cmd:'load',buf:raw},[raw]);info.classList.remove('hidden');let extra='';if(meta.description)extra+=`<br><span class="muted">${html(meta.description)}</span>`;if(meta.input_convention)extra+=`<details><summary>Eingabeformat</summary><pre>${html(JSON.stringify(meta.input_convention,null,2))}</pre></details>`;if(arch===3)extra+=`<div style="margin-top:8px"><span class="pill">TMR5 learned ReLU</span><span class="pill">${pk.inputDim} → ${meta.hidden_layers?.join(' → ')||'?'} → ${pk.outputDim}</span><span class="pill">${meta.parameter_count?.toLocaleString('de-DE')||'?'} Parameter</span>${meta.verification_accuracy!=null?`<span class="pill">Verifikation ${(meta.verification_accuracy*100).toFixed(3)} %</span>`:''}</div>`;info.innerHTML=`<b>${html(meta.name||'TM')}</b>${extra}`;const learnedText=arch===3&&meta.task_kind==='text_next_char';textUI.classList.toggle('hidden',!(arch===1||learnedText));tableUI.classList.toggle('hidden',arch!==2);denseUI.classList.toggle('hidden',arch!==3||learnedText);if(arch===1)initText(pk);else if(arch===2)initTable();else if(learnedText)initLearnedText(pk);else initDense(pk);loadstatus.textContent='Geladen.'}
file.onchange=async()=>{if(file.files[0])try{await loadBuffer(await file.files[0].arrayBuffer())}catch(e){loadstatus.textContent='Fehler: '+e.message}};
async function loadURL(){const p=new URLSearchParams(location.search).get('model');if(!p)return;try{loadstatus.textContent='Lade '+p+' …';const r=await fetch(p);if(!r.ok)throw Error(r.status);await loadBuffer(await r.arrayBuffer())}catch(e){loadstatus.textContent='Fehler beim Laden: '+e.message}}
function initText(pk){textTape.value=meta.example_prompt||'';textState.textContent=`variable Ordnung 1…${pk.N} · ${(pk.top*100).toFixed(2)} % bei max n · kurze Prompts fallen automatisch zurück`}
function initLearnedText(pk){textTape.value=meta.example_prompt||'';textState.textContent=`TMR5 · Kontext n=${meta.context_order} · Hidden ${meta.hidden_layers?.join('–')||'?'} · Vollverifikation ${meta.verification_accuracy!=null?(meta.verification_accuracy*100).toFixed(3)+' %':'unbekannt'}`}
function initDense(pk){denseInput.value=Array(pk.inputDim).fill(0).join(', ');denseOutput.textContent=`Input-Dimension ${pk.inputDim}, Output-Dimension ${pk.outputDim}.`}
document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{if(busy)return;setBusy(true);textState.textContent='Rechnet im Worker …';worker.postMessage({cmd:'text',prompt:textTape.value,n:+b.dataset.out})});
denseEval.onclick=()=>{if(busy)return;setBusy(true);worker.postMessage({cmd:'denseEval',text:denseInput.value})};
function currentTapes(){return [...document.querySelectorAll('.tin')].map(x=>x.value)}
function initTable(){const ex=(meta.examples||[])[0];tapeInputs.innerHTML=ex?`<p class="good"><b>Beispiel ist eingesetzt:</b> ${html(ex.name)}. Einfach +1/+10/+100 oder „Bis HALT“ drücken.</p>`:'';for(let i=0;i<meta.num_tapes;i++){const d=document.createElement('div');d.className='tinwrap';d.innerHTML=`<label>Band ${i+1}</label><input type="text" class="tin" value="${html(ex?.tapes?.[i]||'')}">`;tapeInputs.appendChild(d)}tapeInputs.insertAdjacentHTML('beforeend','<div class="row" style="margin-top:10px"><button id="resetGeneric" class="secondary">Start / Reset</button></div>');document.querySelectorAll('.tin').forEach(x=>x.oninput=()=>genericDirty=true);document.getElementById('resetGeneric').onclick=()=>{genericDirty=false;worker.postMessage({cmd:'resetGeneric',tapes:currentTapes()})};genericDirty=true;worker.postMessage({cmd:'resetGeneric',tapes:currentTapes()})}
function renderSnap(s){genState.textContent=`Zustand: ${s.stateName} · Schritte: ${s.steps}${s.halt?' · HALT':''}`;tapeViews.innerHTML='';for(let t=0;t<s.views.length;t++){const v=s.views[t];let str='';for(let j=0;j<v.cells.length;j++){const c=html(v.cells[j]);str+=v.lo+j===v.h?`<span class="head">${c}</span>`:c}tapeViews.innerHTML+=`<div class="tape"><b>Band ${t+1}</b> h=${v.h} · ${str}</div>`}}
function runGen(n,until=false){if(busy)return;setBusy(true);const msg={cmd:'runGeneric',n,until};if(genericDirty){msg.tapes=currentTapes();genericDirty=false}worker.postMessage(msg)}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>runGen(+b.dataset.step));haltBtn.onclick=()=>runGen(0,true);stopBtn.onclick=()=>worker.postMessage({cmd:'stop'});loadURL();
</script></main></body></html>
