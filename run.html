<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run ReLU/TMR6 Markov-TM</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3f3f3;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:940px;margin:auto;padding:16px}h1{font-size:22px}.card{background:#181818;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:12px;background:#2f6fed;color:#fff;padding:12px 17px;font-weight:700;font-size:16px}button.danger{background:#8b2f2f}button:disabled{opacity:.45}input[type=file],textarea{width:100%;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:180px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.muted,small{color:#aaa}.good{color:#8ee29b}.warn{color:#ffd27d}.pill{display:inline-block;border-radius:999px;padding:4px 9px;background:#2a2a2a;margin:2px 4px 2px 0;font-size:13px}</style></head>
<body><main><h1>Run ReLU Markov-TM · Text lesen</h1>
<div class="card"><label>Gelernte ReLU-TM (<code>*.tm.relu.gz</code>)</label><input id="model" type="file" accept=".gz,.tm.relu.gz,application/gzip"><div id="modelStatus" class="muted" style="margin-top:8px">Noch kein Modell geladen.</div><div id="info" style="margin-top:8px"></div></div>
<div class="card"><label>Text auf dem Band</label><textarea id="text" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Text eingeben …"></textarea><div class="row" style="margin-top:10px"><button data-step="1">+1</button><button data-step="10">+10</button><button data-step="100">+100</button><button id="clear" class="danger">Löschen</button></div><div id="runStatus" class="muted" style="margin-top:10px">Modell laden und Text eingeben. Die Maschine startet im Root-Zustand am ersten Zeichen.</div></div>
<script>
const modelFile=document.getElementById('model'),modelStatus=document.getElementById('modelStatus'),info=document.getElementById('info'),text=document.getElementById('text'),runStatus=document.getElementById('runStatus'),clearBtn=document.getElementById('clear');let worker=null,loaded=false,busy=false,version=0;
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}function setBusy(v){busy=v;document.querySelectorAll('[data-step]').forEach(b=>b.disabled=v||!loaded)}
const workerCode=String.raw`
let M=null,session={text:'',state:0,head:0,halt:false,version:-1,tape:new Map()};
async function ungzipMaybe(ab){const u=new Uint8Array(ab);if(u.length>=2&&u[0]===0x1f&&u[1]===0x8b){if(!self.DecompressionStream)throw Error('DecompressionStream fehlt.');return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}return ab}
function argmax(a,o,n){let k=0;for(let i=1;i<n;i++)if(a[o+i]>a[o+k])k=i;return k}
function pop32(x){x=x>>>0;x=x-((x>>>1)&0x55555555);x=(x&0x33333333)+((x>>>2)&0x33333333);return (((x+(x>>>4))&0x0F0F0F0F)*0x01010101)>>>24}
function common(meta,A,inputDim,outputDim){const bits=Number(meta.state_bits),S=Number(meta.state_count),actions=meta.action_classes;if(meta.task_kind!=='tm_transition_controller'||!Array.isArray(actions))throw Error('Kein TM-Transition-Controller.');if(inputDim!==bits+A.length||outputDim!==bits+actions.length)throw Error('Dimensionsfehler im Artefakt.');const sm=new Map(A.map((c,i)=>[c,i])),blank=meta.blank,blankId=sm.get(blank),halts=new Set((meta.halt_states||[]).map(Number));if(blankId===undefined)throw Error('Blank fehlt.');return{inputDim,outputDim,V:A.length,A,meta,bits,S,actions,sm,blank,blankId,halts}}
function parse5(buf){const u=new Uint8Array(buf),dv=new DataView(buf),inputDim=dv.getUint32(8,true),outputDim=dv.getUint32(12,true),lc=dv.getUint32(16,true),ml=dv.getUint32(20,true),td=new TextDecoder();if(24+ml>u.length)throw Error('Beschädigte Metadaten.');const meta=JSON.parse(td.decode(u.slice(24,24+ml)));let p=24+ml,V=dv.getUint16(p,true);p+=8;const A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}const layers=[];for(let li=0;li<lc;li++){const inn=dv.getUint32(p,true);p+=4;const out=dv.getUint32(p,true);p+=4;const act=u[p++];p+=3;const W=new Float32Array(inn*out),b=new Float32Array(out);for(let i=0;i<W.length;i++){W[i]=dv.getFloat32(p,true);p+=4}for(let i=0;i<b.length;i++){b[i]=dv.getFloat32(p,true);p+=4}layers.push({inn,out,act,W,b})}return{kind:'dense',layers,...common(meta,A,inputDim,outputDim)}}
function parse6(buf){const u=new Uint8Array(buf),dv=new DataView(buf),inputDim=dv.getUint32(8,true),outputDim=dv.getUint32(12,true),T=dv.getUint32(16,true),ml=dv.getUint32(20,true),td=new TextDecoder();if(24+ml>u.length)throw Error('Beschädigte TMR6-Metadaten.');const meta=JSON.parse(td.decode(u.slice(24,24+ml)));let p=24+ml,V=dv.getUint32(p,true);p+=4;const A=[];for(let i=0;i<V;i++){const z=dv.getUint16(p,true);p+=2;A.push(td.decode(u.slice(p,p+z)));p+=z}if(p+12*T>u.length)throw Error('Beschädigte TMR6-Detektordaten.');const src=new Uint32Array(T),read=new Uint16Array(T),act=new Uint16Array(T),next=new Uint32Array(T),byRead=Array.from({length:V},()=>[]);for(let i=0;i<T;i++){src[i]=dv.getUint32(p,true);p+=4;read[i]=dv.getUint16(p,true);p+=2;act[i]=dv.getUint16(p,true);p+=2;next[i]=dv.getUint32(p,true);p+=4;if(read[i]>=V)throw Error('Ungültiger Detektor '+i);byRead[read[i]].push(i)}return{kind:'exact',T,src,read,act,next,byRead,...common(meta,A,inputDim,outputDim)}}
function parse(buf){const u=new Uint8Array(buf);if(u.length<24)throw Error('ReLU-Artefakt zu kurz.');const magic=String.fromCharCode(...u.slice(0,4));if(magic==='TMR5')return parse5(buf);if(magic==='TMR6')return parse6(buf);throw Error('Erwartet TMR5 oder TMR6 ReLU-Artefakt.')}
function forwardDense(x){for(const L of M.layers){const y=new Float32Array(L.out);for(let j=0;j<L.out;j++){let s=L.b[j],base=j*L.inn;for(let i=0;i<L.inn;i++)s+=L.W[base+i]*x[i];y[j]=L.act?(s>0?s:0):s}x=y}return x}
function enc(s,a){const x=new Float32Array(M.inputDim);for(let b=0;b<M.bits;b++)x[b]=Math.floor(s/(2**b))%2;x[M.bits+a]=1;return x}
function ds(y){let s=0;for(let b=0;b<M.bits;b++)if(y[b]>=0)s+=2**b;return s}
function inferExact(s,a){const list=M.byRead[a]||[];for(let z=0;z<list.length;z++){const i=list[z];const h=Math.max(0,1-pop32((s>>>0)^M.src[i]));if(h>0)return{ns:M.next[i],ai:M.act[i],active:true}}return{ns:0,ai:0,active:false}}
function reset(txt,ver){const chars=Array.from(txt);for(const c of chars)if(!M.sm.has(c))throw Error('Zeichen nicht im Trainingsalphabet: '+JSON.stringify(c));const tape=new Map();for(let i=0;i<chars.length;i++)tape.set(i,chars[i]);session={text:txt,state:Number(M.meta.start_state),head:0,halt:M.halts.has(Number(M.meta.start_state)),version:ver,tape}}
function visible(){let max=-1;for(const [i,c] of session.tape)if(i>=0&&c!==M.blank&&i>max)max=i;let s='';for(let i=0;i<=max;i++){const c=session.tape.get(i);if(c!==undefined&&c!==M.blank)s+=c}return s}
function stepMany(n){let done=0,lastRead=M.blank;for(;done<n&&!session.halt;done++){const read=session.tape.get(session.head)??M.blank,ri=M.sm.get(read);if(ri===undefined)throw Error('Bandsymbol nicht im Modellalphabet: '+JSON.stringify(read));lastRead=read;let ns,ai;if(M.kind==='exact'){const r=inferExact(session.state,ri);if(!r.active)throw Error('Für Zustand '+session.state+' und Symbol '+JSON.stringify(read)+' ist kein ReLU-Detektor aktiv.');ns=r.ns;ai=r.ai}else{const y=forwardDense(enc(session.state,ri));ns=ds(y);ai=argmax(y,M.bits,M.actions.length)}if(ns<0||ns>=M.S)throw Error('ReLU dekodiert ungültigen Folgezustand '+ns);const act=M.actions[ai];if(!act)throw Error('Ungültige Aktion.');const wi=Number(act.write_symbol_id),wr=M.A[wi];if(wr===undefined)throw Error('Ungültiges Schreibsymbol.');if(wr===M.blank)session.tape.delete(session.head);else session.tape.set(session.head,wr);const mv=act.move;if(mv==='R'||mv===1)session.head++;else if(mv==='L'||mv===2)session.head--;else if(mv==='S'||mv===0){}else throw Error('Unbekannte Bewegung '+mv);session.state=ns;session.halt=M.halts.has(ns)}return{text:visible(),done,state:session.state,head:session.head,halt:session.halt,lastRead}}
onmessage=async ev=>{try{const x=ev.data;if(x.cmd==='load'){M=parse(await ungzipMaybe(x.buf));reset('',0);postMessage({kind:'loaded',name:M.meta.name||'ReLU-TM',verification:M.meta.verification_accuracy||0,states:M.S,bits:M.bits,alphabet:M.V,widths:M.meta.hidden_layers||[],maxOrder:M.meta.source_context_model?.max_order||null,coverage:M.meta.source_context_model?.coverage_target??null,architecture:M.meta.architecture||M.kind,detectors:M.meta.detector_count||null})}else if(x.cmd==='reset'){if(!M)throw Error('Kein Modell geladen.');reset(String(x.text||''),x.version);postMessage({kind:'resetDone',state:session.state,head:session.head,halt:session.halt})}else if(x.cmd==='step'){if(!M)throw Error('Kein Modell geladen.');if(session.version!==x.version)reset(String(x.text||''),x.version);postMessage({kind:'stepDone',...stepMany(Math.max(0,Math.min(100000,Number(x.n)||0)))})}}catch(e){postMessage({kind:'error',message:String(e.message||e)})}};
`;
function makeWorker(){if(worker)worker.terminate();worker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'})));worker.onmessage=ev=>{const x=ev.data;if(x.kind==='loaded'){loaded=true;modelStatus.innerHTML=`<span class="good"><b>Geladen:</b></span> ${esc(x.name)} · ${(100*x.verification).toFixed(3)} % ReLU-TM-Treue`;info.innerHTML=`<span class="pill">${x.states.toLocaleString('de-DE')} Zustände</span><span class="pill">${x.bits} Zustandsbits</span><span class="pill">Alphabet ${x.alphabet}</span>${x.detectors?`<span class="pill good">Exact ${x.detectors.toLocaleString('de-DE')} ReLU-Detektoren</span>`:`<span class="pill">Hidden ${esc((x.widths||[]).join('–'))}</span>`}${x.maxOrder?`<span class="pill good">Markov N≤${x.maxOrder}</span>`:''}${x.coverage!=null?`<span class="pill">Abdeckung ${(100*x.coverage).toFixed(1)} %</span>`:''}`;setBusy(false);version++;worker.postMessage({cmd:'reset',text:text.value,version});runStatus.textContent='Bereit: Root-Zustand, Kopf auf Zeichen 1.'}else if(x.kind==='resetDone'){runStatus.textContent='Zurückgesetzt: Root-Zustand, Kopf auf Zeichen 1.';setBusy(false)}else if(x.kind==='stepDone'){if(x.text!==text.value){text.value=x.text;version++}runStatus.innerHTML=`<span class="good"><b>+${x.done} ReLU-TM-Schritte</b></span> · Kopf ${x.head} · Zustand ${x.state}${x.halt?' · HALT':''} · zuletzt gelesen ${esc(JSON.stringify(x.lastRead))}`;setBusy(false)}else if(x.kind==='error'){runStatus.textContent='Fehler: '+x.message;modelStatus.textContent=loaded?modelStatus.textContent:'Fehler: '+x.message;setBusy(false)}}}
makeWorker();modelFile.onchange=async()=>{const f=modelFile.files[0];if(!f)return;loaded=false;setBusy(true);modelStatus.textContent='Lade '+f.name+' …';const ab=await f.arrayBuffer();worker.postMessage({cmd:'load',buf:ab},[ab])};text.addEventListener('input',()=>{version++;if(loaded){worker.postMessage({cmd:'reset',text:text.value,version});runStatus.textContent='Text geändert: Maschine wird auf Root/Kopf 0 zurückgesetzt.'}});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{if(!loaded||busy)return;setBusy(true);worker.postMessage({cmd:'step',text:text.value,version,n:+b.dataset.step})});clearBtn.onclick=()=>{text.value='';version++;if(loaded)worker.postMessage({cmd:'reset',text:'',version});runStatus.textContent='Text gelöscht; Root-Zustand wiederhergestellt.'};setBusy(false);
</script></main></body></html>
