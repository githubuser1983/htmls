<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run TM</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3f3f3;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}a{color:#8ab4ff}h1{font-size:22px}h2{font-size:18px;margin-top:24px}.card{background:#181818;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,.btn{border:0;border-radius:12px;background:#2f6fed;color:#fff;padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block;touch-action:manipulation}button.secondary,.btn.secondary{background:#444}button.danger{background:#8b2f2f}button:disabled{opacity:.45}input[type=file],input[type=text],textarea{width:100%;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:180px}small,.muted{color:#aaa}.good{color:#8ee29b}.err{color:#ff9a9a}code{background:#222;padding:2px 5px;border-radius:5px}.bar{height:8px;background:#333;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#2f6fed;width:0}.filetree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7}.filetree a{text-decoration:none}.tape{overflow:auto;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#080808;border-radius:10px;padding:10px;margin:7px 0}.head{background:#fff;color:#111;border-radius:4px;padding:1px 3px}.hidden{display:none!important}.tinwrap{margin:8px 0}.busy{opacity:.8}</style></head><body><main>
<h1>Run TM</h1><div class="card"><input id="file" type="file" accept=".tm,.gz,.tm.gz"><div id="loadstatus" class="muted">TM-Datei laden oder eine vorkompilierte Maschine von der Startseite öffnen.</div></div><div id="info" class="card hidden"></div>
<div id="textUI" class="hidden"><div class="card"><textarea id="textTape" spellcheck="false" autocapitalize="off"></textarea><div class="row" style="margin-top:10px"><button data-out="1">+1</button><button data-out="10">+10</button><button data-out="100">+100</button></div><div id="textState" class="muted"></div></div></div>
<div id="tableUI" class="hidden"><div class="card" id="tapeInputs"></div><div class="card"><div class="row"><button data-step="1">+1</button><button data-step="10">+10</button><button data-step="100">+100</button><button id="halt" class="secondary">Bis HALT</button><button id="stop" class="danger" disabled>Stop</button></div><div id="genState" class="muted"></div><div id="tapeViews"></div></div></div>
<div class="row"><a class="btn secondary" href="index.html">Zurück</a></div>
<script>
const file=document.getElementById('file'),loadstatus=document.getElementById('loadstatus'),info=document.getElementById('info'),textUI=document.getElementById('textUI'),tableUI=document.getElementById('tableUI'),textTape=document.getElementById('textTape'),textState=document.getElementById('textState'),tapeInputs=document.getElementById('tapeInputs'),tapeViews=document.getElementById('tapeViews'),genState=document.getElementById('genState'),haltBtn=document.getElementById('halt'),stopBtn=document.getElementById('stop');let meta=null,arch=0,worker=null,genericDirty=true,busy=false;
function html(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function ungzip(buf){const u=new Uint8Array(buf);if(u[0]===0x1f&&u[1]===0x8b){if(!globalThis.DecompressionStream)throw Error('DecompressionStream fehlt; bitte aktuelles Chrome/Chromium verwenden.');return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}return buf}
function peek(buf){const u=new Uint8Array(buf),dv=new DataView(buf),magic=String.fromCharCode(...u.slice(0,4)),td=new TextDecoder(),ml=dv.getUint32(20,true),m=JSON.parse(td.decode(u.slice(24,24+ml)));if(magic==='TMR4')return {arch:1,meta:m,N:u[6],V:u[7],top:dv.getFloat32(16,true)};if(magic==='TMR3')return {arch:2,meta:m,T:u[6],V:u[7]};throw Error('Unbekanntes Modellformat.')}
const workerCode=String.raw`
let model=null,M=null,cancel=false;
function parse(buf){const u=new Uint8Array(buf),dv=new DataView(buf),magic=String.fromCharCode(...u.slice(0,4)),td=new TextDecoder(),ml=dv.getUint32(20,true),meta=JSON.parse(td.decode(u.slice(24,24+ml)));let p=24+ml;if(magic==='TMR4'){const N=u[6],V=u[7],R=dv.getUint32(8,true),L=dv.getUint32(12,true),top=dv.getFloat32(16,true),A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}const globalOut=u[p++],counts=new Uint32Array(N+1),bases=new Uint32Array(N+1);for(let k=1;k<=N;k++){counts[k]=dv.getUint32(p,true);p+=4}let b=p;for(let k=1;k<=N;k++){bases[k]=b;b+=counts[k]*(k+1)}return {arch:1,N,V,R,L,top,meta,A,globalOut,counts,bases,u}}if(magic==='TMR3'){const T=u[6],V=u[7],S=dv.getUint32(8,true),R=dv.getUint32(12,true),start=dv.getUint32(16,true),A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}const hc=dv.getUint16(p,true);p+=2;const halts=new Set();for(let i=0;i<hc;i++){halts.add(dv.getUint32(p,true));p+=4}const names=[];for(let i=0;i<S;i++){const z=dv.getUint16(p,true);p+=2;names.push(td.decode(u.slice(p,p+z)));p+=z}const offs=new Uint32Array(S+1);for(let i=0;i<=S;i++){offs[i]=dv.getUint32(p,true);p+=4}return {arch:2,T,V,S,R,start,meta,A,halts,names,offs,u,rows:p,rowSize:4+3*T}}throw Error('Unbekanntes Modellformat.')}
function lookupText(k,ctx){const m=model,u=m.u,base=m.bases[k],rs=k+1;let lo=0,hi=m.counts[k]-1;while(lo<=hi){const mid=(lo+hi)>>>1,o=base+mid*rs;let cmp=0;for(let j=0;j<k;j++){const d=u[o+j]-ctx[ctx.length-k+j];if(d){cmp=d;break}}if(!cmp)return u[o+k];if(cmp<0)lo=mid+1;else hi=mid-1}return -1}
function runText(prompt,n){const sm=new Map(model.A.map((x,i)=>[x,i]));for(const [a,c] of Object.entries(model.meta.input_aliases||{})){const id=sm.get(c);if(id!==undefined)sm.set(a,id)}const ctx=[],chars=Array.from(prompt);let steps=0;for(const c of chars){const id=sm.get(c);if(id===undefined)throw Error('Zeichen nicht im TM-Alphabet: '+JSON.stringify(c));ctx.push(id);if(ctx.length>model.N)ctx.shift();steps++}let used=0;for(let g=0;g<n;g++){let out=-1,order=0;for(let k=Math.min(model.N,ctx.length);k>=1;k--){out=lookupText(k,ctx);if(out>=0){order=k;break}}if(out<0){out=model.globalOut;order=0}chars.push(model.A[out]);ctx.push(out);if(ctx.length>model.N)ctx.shift();steps++;used=order}return {text:chars.join(''),steps,usedOrder:used}}
function resetGeneric(tapes){const sm=new Map(model.A.map((x,i)=>[x,i]));M={state:model.start,heads:Array(model.T).fill(0),tapes:[],steps:0,halt:false,sm};for(let t=0;t<model.T;t++){const mp=new Map(),s=Array.from(tapes[t]||'');for(let i=0;i<s.length;i++)mp.set(i,s[i]);M.tapes.push(mp)}}
function findRow(read){const m=model,u=m.u;let lo=m.offs[M.state],hi=m.offs[M.state+1]-1;while(lo<=hi){const mid=(lo+hi)>>>1,o=m.rows+mid*m.rowSize;let cmp=0;for(let j=0;j<m.T;j++){const d=u[o+j]-read[j];if(d){cmp=d;break}}if(!cmp)return o;if(cmp<0)lo=mid+1;else hi=mid-1}return -1}
function stepGeneric(){if(M.halt)return false;const blank=model.meta.blank,read=[];for(let t=0;t<model.T;t++){const c=M.tapes[t].get(M.heads[t])??blank,id=M.sm.get(c);if(id===undefined)throw Error('Bandsymbol nicht im Alphabet: '+c);read.push(id)}const o=findRow(read);if(o<0){M.halt=true;return false}let p=o+model.T,dv=new DataView(model.u.buffer,model.u.byteOffset,model.u.byteLength),ns=dv.getUint32(p,true);p+=4,wr=[],mv=[];for(let t=0;t<model.T;t++)wr.push(model.u[p++]);for(let t=0;t<model.T;t++)mv.push(model.u[p++]);for(let t=0;t<model.T;t++){const c=model.A[wr[t]];if(c===blank)M.tapes[t].delete(M.heads[t]);else M.tapes[t].set(M.heads[t],c);if(mv[t]===1)M.heads[t]++;else if(mv[t]===2)M.heads[t]--}M.state=ns;M.steps++;if(model.halts.has(ns))M.halt=true;return true}
function snapshot(){const views=[];for(let t=0;t<model.T;t++){const h=M.heads[t],lo=h-12,hi=h+12,cells=[];for(let i=lo;i<=hi;i++)cells.push(M.tapes[t].get(i)??model.meta.blank);views.push({h,lo,cells})}return {state:M.state,stateName:model.names[M.state]||('q'+M.state),steps:M.steps,halt:M.halt,views}}
async function runGeneric(count,until){cancel=false;let done=0,last=performance.now();const limit=until?50000000:count;while(!M.halt&&!cancel&&done<limit){if(!stepGeneric())break;done++;const now=performance.now();if(now-last>25){postMessage({kind:'progress',snap:snapshot()});last=now;await new Promise(r=>setTimeout(r,0))}}postMessage({kind:'genericDone',snap:snapshot(),cancelled:cancel})}
onmessage=async ev=>{try{const x=ev.data;if(x.cmd==='load'){model=parse(x.buf);postMessage({kind:'loaded',arch:model.arch})}else if(x.cmd==='text'){postMessage({kind:'textDone',...runText(x.prompt,x.n)})}else if(x.cmd==='resetGeneric'){resetGeneric(x.tapes);postMessage({kind:'genericDone',snap:snapshot()})}else if(x.cmd==='runGeneric'){if(x.tapes)resetGeneric(x.tapes);await runGeneric(x.n||0,!!x.until)}else if(x.cmd==='stop')cancel=true}catch(e){postMessage({kind:'error',message:String(e.message||e)})}};`;
function makeWorker(){if(worker)worker.terminate();worker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'})));worker.onmessage=onWorker}
function setBusy(v){busy=v;document.querySelectorAll('button[data-out],button[data-step],#halt').forEach(b=>b.disabled=v);stopBtn.disabled=!v}
function onWorker(ev){const x=ev.data;if(x.kind==='textDone'){textTape.value=x.text;textTape.scrollTop=textTape.scrollHeight;textState.textContent=`TM-Schritte ${x.steps} · letzter verwendeter Kontext ${x.usedOrder}`;setBusy(false)}else if(x.kind==='progress'){renderSnap(x.snap)}else if(x.kind==='genericDone'){renderSnap(x.snap);genericDirty=false;setBusy(false)}else if(x.kind==='error'){loadstatus.textContent='Fehler: '+x.message;setBusy(false)}}
async function loadBuffer(ab){const raw=await ungzip(ab),pk=peek(raw);meta=pk.meta;arch=pk.arch;makeWorker();worker.postMessage({cmd:'load',buf:raw},[raw]);info.classList.remove('hidden');let extra='';if(meta.description)extra+=`<br><span class="muted">${html(meta.description)}</span>`;if(meta.input_convention)extra+=`<details><summary>Eingabeformat</summary><pre>${html(JSON.stringify(meta.input_convention,null,2))}</pre></details>`;info.innerHTML=`<b>${html(meta.name||'TM')}</b>${extra}`;textUI.classList.toggle('hidden',arch!==1);tableUI.classList.toggle('hidden',arch!==2);if(arch===1)initText(pk);else initTable();loadstatus.textContent='Geladen.'}
file.onchange=async()=>{if(file.files[0])try{await loadBuffer(await file.files[0].arrayBuffer())}catch(e){loadstatus.textContent='Fehler: '+e.message}};
async function loadURL(){const p=new URLSearchParams(location.search).get('model');if(!p)return;try{loadstatus.textContent='Lade '+p+' …';const r=await fetch(p);if(!r.ok)throw Error(r.status);await loadBuffer(await r.arrayBuffer())}catch(e){loadstatus.textContent='Fehler beim Laden: '+e.message}}
function initText(pk){textTape.value=meta.example_prompt||'';textState.textContent=`variable Ordnung 1…${pk.N} · ${(pk.top*100).toFixed(2)} % bei max n · kurze Prompts fallen automatisch zurück`}
document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>{if(busy)return;setBusy(true);textState.textContent='Rechnet im Worker …';worker.postMessage({cmd:'text',prompt:textTape.value,n:+b.dataset.out})});
function currentTapes(){return [...document.querySelectorAll('.tin')].map(x=>x.value)}
function initTable(){const ex=(meta.examples||[])[0];tapeInputs.innerHTML=ex?`<p class="good"><b>Beispiel ist eingesetzt:</b> ${html(ex.name)}. Einfach +1/+10/+100 oder „Bis HALT“ drücken.</p>`:'';for(let i=0;i<meta.num_tapes;i++){const d=document.createElement('div');d.className='tinwrap';d.innerHTML=`<label>Band ${i+1}</label><input type="text" class="tin" value="${html(ex?.tapes?.[i]||'')}">`;tapeInputs.appendChild(d)}tapeInputs.insertAdjacentHTML('beforeend','<div class="row" style="margin-top:10px"><button id="resetGeneric" class="secondary">Start / Reset</button></div>');document.querySelectorAll('.tin').forEach(x=>x.oninput=()=>genericDirty=true);document.getElementById('resetGeneric').onclick=()=>{genericDirty=false;worker.postMessage({cmd:'resetGeneric',tapes:currentTapes()})};genericDirty=true;worker.postMessage({cmd:'resetGeneric',tapes:currentTapes()})}
function renderSnap(s){genState.textContent=`Zustand: ${s.stateName} · Schritte: ${s.steps}${s.halt?' · HALT':''}`;tapeViews.innerHTML='';for(let t=0;t<s.views.length;t++){const v=s.views[t];let str='';for(let j=0;j<v.cells.length;j++){const c=html(v.cells[j]);str+=v.lo+j===v.h?`<span class="head">${c}</span>`:c}tapeViews.innerHTML+=`<div class="tape"><b>Band ${t+1}</b> h=${v.h} · ${str}</div>`}}
function runGen(n,until=false){if(busy)return;setBusy(true);const msg={cmd:'runGeneric',n,until};if(genericDirty){msg.tapes=currentTapes();genericDirty=false}worker.postMessage(msg)}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>runGen(+b.dataset.step));haltBtn.onclick=()=>runGen(0,true);stopBtn.onclick=()=>worker.postMessage({cmd:'stop'});loadURL();
</script></main></body></html>
