<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Run TM</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3f3f3;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}a{color:#8ab4ff}h1{font-size:22px}h2{font-size:18px;margin-top:24px}.card{background:#181818;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,.btn{border:0;border-radius:12px;background:#2f6fed;color:#fff;padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#444}button:disabled{opacity:.45}input[type=file],textarea{width:100%;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:180px}small,.muted{color:#aaa}.good{color:#8ee29b}.err{color:#ff9a9a}code{background:#222;padding:2px 5px;border-radius:5px}.bar{height:8px;background:#333;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#2f6fed;width:0}.filetree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7}.filetree a{text-decoration:none}.tape{overflow:auto;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#080808;border-radius:10px;padding:10px;margin:7px 0}.head{background:#fff;color:#111;border-radius:4px;padding:1px 3px}.hidden{display:none!important}
</style></head><body><main>
<h1>Run TM</h1><div class="card"><input id="file" type="file" accept=".tm,.gz,.tm.gz"><div id="loadstatus" class="muted">TM-Datei laden oder eine vorkompilierte Maschine aus der Startseite öffnen.</div></div><div id="info" class="card hidden"></div>
<div id="textUI" class="hidden"><div class="card"><textarea id="textTape" spellcheck="false" autocapitalize="off"></textarea><div class="row" style="margin-top:10px"><button data-out="1">+1</button><button data-out="10">+10</button><button data-out="100">+100</button></div><div id="textState" class="muted"></div></div></div>
<div id="tableUI" class="hidden"><div class="card" id="tapeInputs"></div><div class="card"><div class="row"><button data-step="1">+1</button><button data-step="10">+10</button><button data-step="100">+100</button><button id="halt" class="secondary">Bis HALT</button></div><div id="genState" class="muted"></div><div id="tapeViews"></div></div></div>
<div class="row"><a class="btn secondary" href="index.html">Zurück</a></div>
<script>
const file=document.getElementById('file'),loadstatus=document.getElementById('loadstatus'),info=document.getElementById('info'),textUI=document.getElementById('textUI'),tableUI=document.getElementById('tableUI');let model=null,M=null;
async function ungzip(buf){const u=new Uint8Array(buf);if(u[0]===0x1f&&u[1]===0x8b){if(!DecompressionStream)throw Error('DecompressionStream fehlt; bitte aktuelles Chrome/Chromium verwenden.');return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}return buf}
function parse(buf){const u=new Uint8Array(buf),dv=new DataView(buf),magic=String.fromCharCode(...u.slice(0,4));let p=24;const td=new TextDecoder();if(magic==='TMR2'){const n=u[6],V=u[7],R=dv.getUint32(8,true),L=dv.getUint32(12,true),top=dv.getFloat32(16,true),ml=dv.getUint32(20,true),meta=JSON.parse(td.decode(u.slice(p,p+ml)));p+=ml;const A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}return {arch:1,n,V,R,L,top,meta,A,data:u,records:p,recSize:n+1}}if(magic==='TMR3'){const T=u[6],V=u[7],S=dv.getUint32(8,true),R=dv.getUint32(12,true),start=dv.getUint32(16,true),ml=dv.getUint32(20,true),meta=JSON.parse(td.decode(u.slice(p,p+ml)));p+=ml;const A=[];for(let i=0;i<V;i++){const z=u[p++];A.push(td.decode(u.slice(p,p+z)));p+=z}const hc=dv.getUint16(p,true);p+=2,halts=[];for(let i=0;i<hc;i++){halts.push(dv.getUint32(p,true));p+=4}const names=[];for(let i=0;i<S;i++){const z=dv.getUint16(p,true);p+=2;names.push(td.decode(u.slice(p,p+z)));p+=z}const offs=new Uint32Array(S+1);for(let i=0;i<=S;i++){offs[i]=dv.getUint32(p,true);p+=4}return {arch:2,T,V,S,R,start,meta,A,halts:new Set(halts),names,offs,data:u,rows:p,rowSize:4+3*T}}throw Error('Unbekanntes Modellformat.')}
function html(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function loadBuffer(ab){model=parse(await ungzip(ab));M=null;info.classList.remove('hidden');info.innerHTML=`<b>${html(model.meta.name||'TM')}</b><br><span class="muted">${html(model.meta.architecture||'')}</span>`;textUI.classList.toggle('hidden',model.arch!==1);tableUI.classList.toggle('hidden',model.arch!==2);if(model.arch===1)initText();else initTable();loadstatus.textContent='Geladen.'}
file.onchange=async()=>{if(file.files[0])try{await loadBuffer(await file.files[0].arrayBuffer())}catch(e){loadstatus.textContent='Fehler: '+e.message}};
async function loadURL(){const p=new URLSearchParams(location.search).get('model');if(!p)return;try{loadstatus.textContent='Lade '+p+' …';const r=await fetch(p);if(!r.ok)throw Error(r.status);await loadBuffer(await r.arrayBuffer())}catch(e){loadstatus.textContent='Fehler beim Laden: '+e.message}}
// --- structured text ReLU kernel ---
const textTape=document.getElementById('textTape'),textState=document.getElementById('textState');
function initText(){textTape.value=model.meta.example_prompt||'';if(!textTape.value)textTape.value=model.meta.name?.includes('Faust')?'Habe nun, ach! Philosophie,':'';M=null;textState.textContent=`n=${model.n} · ${(model.top*100).toFixed(2)} % · ${model.R.toLocaleString()} Kontext-Neuronen`}
function resetText(){const chars=Array.from(textTape.value),sm=new Map(model.A.map((x,i)=>[x,i]));M={chars,head:0,ctx:new Uint8Array(model.n),count:0,generated:0,sm,last:textTape.value,halt:false,steps:0}}
function shiftCtx(id){if(model.n>1)M.ctx.copyWithin(0,1);M.ctx[model.n-1]=id;M.count=Math.min(model.n,M.count+1)}
function lookupCtx(){let lo=0,hi=model.R-1,u=model.data,n=model.n,base=model.records,rs=model.recSize;while(lo<=hi){const mid=(lo+hi)>>>1,o=base+mid*rs;let cmp=0;for(let j=0;j<n;j++){const d=u[o+j]-M.ctx[j];if(d){cmp=d;break}}if(!cmp)return u[o+n];if(cmp<0)lo=mid+1;else hi=mid-1}return -1}
function textStep(){if(M.halt)return false;if(M.head<M.chars.length){const c=M.chars[M.head],id=M.sm.get(c);if(id===undefined){M.halt=true;return false}shiftCtx(id);M.head++;M.steps++;return true}if(M.count<model.n){M.halt=true;return false}const out=lookupCtx();if(out<0){M.halt=true;return false}const c=model.A[out];M.chars.push(c);shiftCtx(out);M.head++;M.generated++;M.steps++;return true}
async function gen(n){if(!M||textTape.value!==M.last)resetText();const target=M.generated+n;let guard=0;while(!M.halt&&M.generated<target&&guard<500000){textStep();guard++;if(guard%500===0)await new Promise(r=>setTimeout(r,0))}textTape.value=M.chars.join('');M.last=textTape.value;textTape.scrollTop=textTape.scrollHeight;textState.textContent=`TM-Schritte ${M.steps} · erzeugt ${M.generated} · Kontext ${model.n}${M.halt?' · HALT/unbekannter Kontext':''}`}
document.querySelectorAll('[data-out]').forEach(b=>b.onclick=()=>gen(+b.dataset.out));textTape.oninput=()=>M=null;
// --- generic multi-tape exact sparse ReLU kernel ---
const tapeInputs=document.getElementById('tapeInputs'),tapeViews=document.getElementById('tapeViews'),genState=document.getElementById('genState');
function initTable(){let ex=(model.meta.examples||[])[0];tapeInputs.innerHTML='';for(let i=0;i<model.T;i++){const d=document.createElement('div');d.innerHTML=`<label>Band ${i+1}</label><input class="tin" data-i="${i}" value="${html(ex?.tapes?.[i]||'')}">`;tapeInputs.appendChild(d)}if(ex)tapeInputs.insertAdjacentHTML('afterbegin',`<div class="muted">Beispiel: ${html(ex.name)}</div>`);tapeInputs.insertAdjacentHTML('beforeend','<div class="row" style="margin-top:10px"><button id="resetGeneric" class="secondary">Reset</button></div>');document.getElementById('resetGeneric').onclick=resetTable;resetTable()}
function resetTable(){const blank=model.meta.blank,sm=new Map(model.A.map((x,i)=>[x,i])),inputs=[...document.querySelectorAll('.tin')];M={state:model.start,heads:Array(model.T).fill(0),tapes:[],steps:0,halt:false,sm};for(let t=0;t<model.T;t++){const mp=new Map(),s=Array.from(inputs[t].value);for(let i=0;i<s.length;i++)mp.set(i,s[i]);M.tapes.push(mp)}renderTable()}
function findRow(read){const T=model.T,u=model.data,base=model.rows,rs=model.rowSize;let lo=model.offs[M.state],hi=model.offs[M.state+1]-1;while(lo<=hi){const mid=(lo+hi)>>>1,o=base+mid*rs;let cmp=0;for(let j=0;j<T;j++){const d=u[o+j]-read[j];if(d){cmp=d;break}}if(!cmp)return o;if(cmp<0)lo=mid+1;else hi=mid-1}return -1}
function tableStep(){if(M.halt)return false;const blank=model.meta.blank,read=[];for(let t=0;t<model.T;t++){const c=M.tapes[t].get(M.heads[t])??blank,id=M.sm.get(c);if(id===undefined){M.halt=true;return false}read.push(id)}const o=findRow(read);if(o<0){M.halt=true;return false}let p=o+model.T;const dv=new DataView(model.data.buffer,model.data.byteOffset,model.data.byteLength),ns=dv.getUint32(p,true);p+=4;const wr=[];for(let t=0;t<model.T;t++)wr.push(model.data[p++]);const mv=[];for(let t=0;t<model.T;t++)mv.push(model.data[p++]);for(let t=0;t<model.T;t++){const c=model.A[wr[t]];if(c===blank)M.tapes[t].delete(M.heads[t]);else M.tapes[t].set(M.heads[t],c);if(mv[t]===1)M.heads[t]++;else if(mv[t]===2)M.heads[t]--}M.state=ns;M.steps++;if(model.halts.has(ns))M.halt=true;return true}
function tapeWindow(t){const h=M.heads[t],lo=Math.min(-2,h-10),hi=Math.max(18,h+10);let s='';for(let i=lo;i<=hi;i++){const c=M.tapes[t].get(i)??model.meta.blank;s+=i===h?`<span class="head">${html(c)}</span>`:html(c)}return s}
function renderTable(){genState.textContent=`Zustand: ${model.names[M.state]||('q'+M.state)} · Schritte: ${M.steps}${M.halt?' · HALT':''}`;tapeViews.innerHTML='';for(let t=0;t<model.T;t++)tapeViews.innerHTML+=`<div class="tape"><b>Band ${t+1}</b> h=${M.heads[t]} · ${tapeWindow(t)}</div>`}
async function steps(n){for(let i=0;i<n&&!M.halt;i++){tableStep();if(i%500===0)await new Promise(r=>setTimeout(r,0))}renderTable()}
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>steps(+b.dataset.step));document.getElementById('halt').onclick=async()=>{let i=0;while(!M.halt&&i<2000000){tableStep();i++;if(i%2000===0){renderTable();await new Promise(r=>setTimeout(r,0))}}renderTable()};
loadURL();
</script></main></body></html>
