<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compile General TM</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3f3f3;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}a{color:#8ab4ff}h1{font-size:22px}h2{font-size:18px;margin-top:24px}.card{background:#181818;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,.btn{border:0;border-radius:12px;background:#2f6fed;color:#fff;padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#444}button:disabled{opacity:.45}input[type=file],textarea{width:100%;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:180px}small,.muted{color:#aaa}.good{color:#8ee29b}.err{color:#ff9a9a}code{background:#222;padding:2px 5px;border-radius:5px}.bar{height:8px;background:#333;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#2f6fed;width:0}.filetree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7}.filetree a{text-decoration:none}.tape{overflow:auto;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#080808;border-radius:10px;padding:10px;margin:7px 0}.head{background:#fff;color:#111;border-radius:4px;padding:1px 3px}.hidden{display:none!important}
</style></head><body><main>
<h1>Compile General TM · JSON → exakte ReLU-TM</h1><div class="card"><p>Für beliebige endliche deterministische 1–8-Band-TMs im beiliegenden JSON-Schema.</p><input id="file" type="file" accept=".json,application/json"><div class="row" style="margin-top:10px"><button id="compile">Compile</button><a class="btn secondary" href="examples/tm-json-template.json">JSON-Template</a><a class="btn secondary" href="examples/powermod-source.json">PowerMod-Quelle</a></div></div><div class="card"><div id="status">Bereit.</div><div id="result"></div></div>
<script>
const file=document.getElementById('file'),status=document.getElementById('status'),result=document.getElementById('result'),btn=document.getElementById('compile');
async function gzip(u8){if(!CompressionStream)throw Error('CompressionStream fehlt.');const cs=new CompressionStream('gzip');return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer())}
function encModel(s){const T=s.num_tapes,A=s.tape_alphabet,V=A.length,states=s.states,st=new Map(states.map((q,i)=>[q,i])),sm=new Map(A.map((x,i)=>[x,i]));if(T<1||T>8||V>255)throw Error('v1 unterstützt 1–8 Bänder und höchstens 255 Symbole.');const grouped=[],offs=[0],mv={S:0,R:1,L:2};for(const q of states){const rr=[];for(const [rk,a] of Object.entries((s.transitions||{})[q]||{})){const rd=rk.split('|');if(rd.length!==T)throw Error('Falsche Lesetupel-Länge bei '+q);rr.push([rd.map(x=>sm.get(x)),st.get(a.next_state),a.write.map(x=>sm.get(x)),a.move.map(x=>mv[x])])}rr.sort((a,b)=>{for(let i=0;i<T;i++)if(a[0][i]!==b[0][i])return a[0][i]-b[0][i];return 0});grouped.push(...rr);offs.push(grouped.length)}const meta={name:s.name||'TM',description:s.description||'',architecture:'exact_sparse_relu_table_v1',num_tapes:T,states:states.length,rows:grouped.length,blank:s.blank,input_convention:s.input_convention||{},weights:'one exact sparse ReLU pattern row per defined local transition'};const te=new TextEncoder(),mb=te.encode(JSON.stringify(meta)),abs=A.map(x=>te.encode(x)),nbs=states.map(x=>te.encode(x));let size=24+mb.length+abs.reduce((z,x)=>z+1+x.length,0)+2+(s.halt_states||[]).length*4+nbs.reduce((z,x)=>z+2+x.length,0)+(states.length+1)*4+grouped.length*(4+3*T);const u=new Uint8Array(size),dv=new DataView(u.buffer);u.set([84,77,82,51],0);u[4]=1;u[5]=2;u[6]=T;u[7]=V;dv.setUint32(8,states.length,true);dv.setUint32(12,grouped.length,true);dv.setUint32(16,st.get(s.start_state),true);dv.setUint32(20,mb.length,true);let p=24;u.set(mb,p);p+=mb.length;for(const z of abs){u[p++]=z.length;u.set(z,p);p+=z.length}const hs=s.halt_states||[];dv.setUint16(p,hs.length,true);p+=2;for(const h of hs){dv.setUint32(p,st.get(h),true);p+=4}for(const z of nbs){dv.setUint16(p,z.length,true);p+=2;u.set(z,p);p+=z.length}for(const x of offs){dv.setUint32(p,x,true);p+=4}for(const r of grouped){for(const x of r[0])u[p++]=x;dv.setUint32(p,r[1],true);p+=4;for(const x of r[2])u[p++]=x;for(const x of r[3])u[p++]=x}return [u,meta]}
btn.onclick=async()=>{try{if(!file.files[0])throw Error('JSON-Datei wählen.');btn.disabled=true;const s=JSON.parse(await file.files[0].text()),[raw,meta]=encModel(s),gz=await gzip(raw),url=URL.createObjectURL(new Blob([gz],{type:'application/gzip'})),fn=(s.name||'machine').replace(/[^a-z0-9_-]+/gi,'-')+'.tm.gz';result.innerHTML=`<p class="good">${meta.states} Zustände · ${meta.rows} Regeln · ${(gz.length/1024).toFixed(1)} KiB</p><a id="dl" class="btn">TM herunterladen</a>`;const a=document.getElementById('dl');a.href=url;a.download=fn;status.textContent='Fertig.'}catch(e){status.textContent='Fehler: '+e.message}finally{btn.disabled=false}};
</script></main></body></html>
