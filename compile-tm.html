<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compile TM</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3f3f3;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}a{color:#8ab4ff}h1{font-size:22px}h2{font-size:18px;margin-top:24px}.card{background:#181818;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,.btn{border:0;border-radius:12px;background:#2f6fed;color:#fff;padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block}button.secondary,.btn.secondary{background:#444}button:disabled{opacity:.45}input[type=file],textarea{width:100%;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:180px}small,.muted{color:#aaa}.good{color:#8ee29b}.err{color:#ff9a9a}code{background:#222;padding:2px 5px;border-radius:5px}.bar{height:8px;background:#333;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#2f6fed;width:0}.filetree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7}.filetree a{text-decoration:none}.tape{overflow:auto;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#080808;border-radius:10px;padding:10px;margin:7px 0}.head{background:#fff;color:#111;border-radius:4px;padding:1px 3px}.hidden{display:none!important}
</style></head><body><main>
<h1>Compile TM · Text → kleine ReLU-TM</h1>
<div class="card"><p>Textdatei wählen. Der Compiler nimmt automatisch das größte Modell, das komprimiert unter <b>1 MiB</b> bleibt.</p><input id="file" type="file" accept=".txt,text/plain"><div class="row" style="margin-top:10px"><button id="compile">Compile</button><a class="btn secondary" href="index.html">Zurück</a></div></div>
<div class="card"><div id="status">Bereit.</div><div class="bar"><div id="bar"></div></div><div id="result"></div></div>
<script>
const LIMIT=1024*1024,file=document.getElementById('file'),status=document.getElementById('status'),result=document.getElementById('result'),bar=document.getElementById('bar'),btn=document.getElementById('compile');let loadedText=null,loadedName='text';
function e(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function maybeLoadURL(){const p=new URLSearchParams(location.search).get('text');if(!p)return;const r=await fetch(p);if(!r.ok)return;loadedText=await r.text();loadedName=p.split('/').pop().replace(/\.txt$/i,'');status.textContent='Geladen: '+p}
maybeLoadURL();
file.onchange=async()=>{if(file.files[0]){loadedText=await file.files[0].text();loadedName=file.files[0].name.replace(/\.[^.]+$/,'');status.textContent='Geladen: '+file.files[0].name}};
const workerCode=String.raw`
self.onmessage=async ev=>{
 try{
  const {text0,name,limit}=ev.data; const text=text0.replace(/\s+/gu,' ').trim(); const chars=Array.from(text); if(chars.length<3)throw Error('Text zu kurz.');
  const alphabet=[...new Set(chars)].sort(); if(alphabet.length>255)throw Error('Mehr als 255 verschiedene Zeichen werden in v1 nicht unterstützt.');
  const sm=new Map(alphabet.map((c,i)=>[c,i])); let enc=''; for(const c of chars)enc+=String.fromCharCode(sm.get(c)+1);
  async function gz(u8){if(!self.CompressionStream)throw Error('Dieser Browser unterstützt CompressionStream nicht. Bitte aktuelles Chrome/Chromium verwenden.');const cs=new CompressionStream('gzip');const ab=await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer();return new Uint8Array(ab)}
  function u32(a,o,v){new DataView(a.buffer).setUint32(o,v,true)} function f32(a,o,v){new DataView(a.buffer).setFloat32(o,v,true)}
  function utf8(s){return new TextEncoder().encode(s)}
  let best=null;
  const maxN=Math.min(32,chars.length-1);
  for(let n=1;n<=maxN;n++){
   const m=new Map();
   for(let i=n;i<enc.length;i++){const ctx=enc.slice(i-n,i),nx=enc.charCodeAt(i)-1;let c=m.get(ctx);if(!c){c=new Map();m.set(ctx,c)}c.set(nx,(c.get(nx)||0)+1)}
   const contexts=[...m.keys()].sort(); let correct=0; const recSize=n+1; const records=new Uint8Array(contexts.length*recSize);let rp=0;
   for(const ctx of contexts){let bestId=0,bestC=-1;for(const [id,c] of m.get(ctx))if(c>bestC||(c===bestC&&id<bestId)){bestC=c;bestId=id}correct+=bestC;for(let j=0;j<n;j++)records[rp++]=ctx.charCodeAt(j)-1;records[rp++]=bestId}
   const top1=correct/(chars.length-n); const meta={name,source_chars:chars.length,n,top1,states_observed:contexts.length,architecture:'structured_sparse_relu_text_v1',minimum_prompt_chars:n,weights:'sparse context pattern indices; shared unit weights/bias implicit'};const mb=utf8(JSON.stringify(meta));
   let alphBytes=0,abs=alphabet.map(s=>utf8(s));for(const z of abs)alphBytes+=1+z.length;const head=24;const raw=new Uint8Array(head+mb.length+alphBytes+records.length);raw.set([84,77,82,50],0);raw[4]=1;raw[5]=1;raw[6]=n;raw[7]=alphabet.length;u32(raw,8,contexts.length);u32(raw,12,chars.length);f32(raw,16,top1);u32(raw,20,mb.length);let p=head;raw.set(mb,p);p+=mb.length;for(const z of abs){raw[p++]=z.length;raw.set(z,p);p+=z.length}raw.set(records,p);
   const zipped=await gz(raw); self.postMessage({kind:'progress',n,top1,size:zipped.length,states:contexts.length});
   if(zipped.length<=limit)best={n,top1,size:zipped.length,states:contexts.length,buf:zipped.buffer}; else if(best)break;
  }
  if(!best)throw Error('Schon das kleinste Modell überschreitet das Größenlimit.');self.postMessage({kind:'done',...best},[best.buf]);
 }catch(err){self.postMessage({kind:'error',message:String(err.message||err)})}
}`;
btn.onclick=async()=>{if(!loadedText){status.textContent='Bitte zuerst eine Textdatei wählen.';return}btn.disabled=true;result.innerHTML='';bar.style.width='0';status.textContent='Kompiliere lokal auf diesem Gerät …';const w=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'})));w.onmessage=ev=>{const x=ev.data;if(x.kind==='progress'){status.textContent=`n=${x.n} · ${(x.top1*100).toFixed(2)} % · ${(x.size/1024).toFixed(0)} KiB`;bar.style.width=Math.min(100,x.size/LIMIT*100)+'%'}else if(x.kind==='done'){const blob=new Blob([x.buf],{type:'application/gzip'}),url=URL.createObjectURL(blob),fn=loadedName+'-1mb.tm.gz';result.innerHTML=`<p class="good"><b>Fertig:</b> n=${x.n}, ${(x.top1*100).toFixed(2)} %, ${(x.size/1024).toFixed(0)} KiB, ${x.states.toLocaleString()} gespeicherte Kontext-Neuronen.</p><a class="btn" id="dl">${e(fn)} herunterladen</a>`;const a=document.getElementById('dl');a.href=url;a.download=fn;status.textContent='Fertig.';btn.disabled=false;w.terminate()}else{status.textContent='Fehler: '+x.message;btn.disabled=false;w.terminate()}}};
</script></main></body></html>
