<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compile TM</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101010;color:#f3f3f3;font-family:system-ui,-apple-system,Arial,sans-serif}main{max-width:900px;margin:auto;padding:16px}a{color:#8ab4ff}h1{font-size:22px}h2{font-size:18px;margin-top:24px}.card{background:#181818;border:1px solid #333;border-radius:14px;padding:14px;margin:10px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button,.btn{border:0;border-radius:12px;background:#2f6fed;color:#fff;padding:12px 16px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block;touch-action:manipulation}button.secondary,.btn.secondary{background:#444}button.danger{background:#8b2f2f}button:disabled{opacity:.45}input[type=file],input[type=text],textarea{width:100%;background:#151515;color:#fff;border:1px solid #444;border-radius:12px;padding:12px;font-size:16px}textarea{min-height:180px}small,.muted{color:#aaa}.good{color:#8ee29b}.err{color:#ff9a9a}code{background:#222;padding:2px 5px;border-radius:5px}.bar{height:8px;background:#333;border-radius:8px;overflow:hidden}.bar>div{height:100%;background:#2f6fed;width:0}.filetree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7}.filetree a{text-decoration:none}.tape{overflow:auto;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#080808;border-radius:10px;padding:10px;margin:7px 0}.head{background:#fff;color:#111;border-radius:4px;padding:1px 3px}.hidden{display:none!important}.tinwrap{margin:8px 0}.busy{opacity:.8}</style></head><body><main>
<h1>Compile TM · Text → mobile ReLU-TM</h1>
<div class="card"><p>Textdatei wählen und <b>Compile</b> drücken. Der Compiler nimmt automatisch die größte variable Kontext-TM, die komprimiert unter <b>1 MiB</b> bleibt.</p><input id="file" type="file" accept=".txt,text/plain"><div class="row" style="margin-top:10px"><button id="compile">Compile</button><a class="btn secondary" href="index.html">Zurück</a></div></div>
<div class="card"><div id="status">Bereit.</div><div class="bar"><div id="bar"></div></div><div id="result"></div><small>Die Berechnung läuft in einem Web Worker; die Seite bleibt auch auf dem Handy bedienbar.</small></div>
<script>
const LIMIT=1024*1024,file=document.getElementById('file'),status=document.getElementById('status'),result=document.getElementById('result'),bar=document.getElementById('bar'),btn=document.getElementById('compile');let loadedText=null,loadedName='text';
function e(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function maybeLoadURL(){const p=new URLSearchParams(location.search).get('text');if(!p)return;const r=await fetch(p);if(!r.ok)return;loadedText=await r.text();loadedName=p.split('/').pop().replace(/\.txt$/i,'');status.textContent='Geladen: '+p}maybeLoadURL();
file.onchange=async()=>{if(file.files[0]){loadedText=await file.files[0].text();loadedName=file.files[0].name.replace(/\.[^.]+$/,'');status.textContent='Geladen: '+file.files[0].name}};
const workerCode=String.raw`
self.onmessage=async ev=>{try{
 const {text0,name,limit}=ev.data,text=text0.replace(/\s+/gu,' ').trim(),chars=Array.from(text);if(chars.length<3)throw Error('Text zu kurz.');
 const alphabet=[...new Set(chars)].sort();if(alphabet.length>255)throw Error('Mehr als 255 verschiedene Zeichen werden in v2 nicht unterstützt.');
 const sm=new Map(alphabet.map((c,i)=>[c,i]));let enc='';for(const c of chars)enc+=String.fromCharCode(sm.get(c)+1);
 const globalCnt=new Uint32Array(alphabet.length);for(const c of chars)globalCnt[sm.get(c)]++;let globalOut=0;for(let i=1;i<globalCnt.length;i++)if(globalCnt[i]>globalCnt[globalOut])globalOut=i;const aset=new Set(alphabet),aliases={};for(const c of alphabet){for(const a of [c.toLocaleLowerCase(),c.toLocaleUpperCase()])if(Array.from(a).length===1&&!aset.has(a)&&a!==c)aliases[a]=c;}
 async function gz(u8){if(!self.CompressionStream)throw Error('CompressionStream fehlt; bitte aktuelles Chrome/Chromium verwenden.');const ab=await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return new Uint8Array(ab)}
 const te=new TextEncoder();function u32(a,o,v){new DataView(a.buffer).setUint32(o,v,true)}function f32(a,o,v){new DataView(a.buffer).setFloat32(o,v,true)}
 let groups=[],best=null,totalR=0;const maxN=Math.min(32,chars.length-1);
 function buildRaw(N,top){const meta={name,architecture:'variable_order_sparse_relu_text_v2',description:'Variable-order character TM with longest-known-suffix backoff represented by exact sparse ReLU context detectors.',source_chars:chars.length,max_context_order:N,top1_at_max_order:top,stored_context_neurons:totalR,minimum_prompt_chars:1,example_prompt:'',input_aliases:aliases,weights:'sparse context pattern indices + modal output; shared unit detector weights/bias implicit',execution:'shared context shift + longest active suffix detector'};const mb=te.encode(JSON.stringify(meta)),abs=alphabet.map(x=>te.encode(x));let size=24+mb.length+abs.reduce((z,x)=>z+1+x.length,0)+1+4*N+groups.reduce((z,g)=>z+g.records.length,0);const raw=new Uint8Array(size);raw.set([84,77,82,52],0);raw[4]=1;raw[5]=1;raw[6]=N;raw[7]=alphabet.length;u32(raw,8,totalR);u32(raw,12,chars.length);f32(raw,16,top);u32(raw,20,mb.length);let p=24;raw.set(mb,p);p+=mb.length;for(const z of abs){raw[p++]=z.length;raw.set(z,p);p+=z.length}raw[p++]=globalOut;for(const g of groups){u32(raw,p,g.count);p+=4}for(const g of groups){raw.set(g.records,p);p+=g.records.length}return raw}
 for(let n=1;n<=maxN;n++){
   const m=new Map();for(let i=n;i<enc.length;i++){const ctx=enc.slice(i-n,i),nx=enc.charCodeAt(i)-1;let c=m.get(ctx);if(!c){c=new Map();m.set(ctx,c)}c.set(nx,(c.get(nx)||0)+1)}
   const contexts=[...m.keys()].sort(),records=new Uint8Array(contexts.length*(n+1));let rp=0,correct=0;
   for(const ctx of contexts){let bestId=0,bestC=-1;for(const [id,c] of m.get(ctx))if(c>bestC||(c===bestC&&id<bestId)){bestC=c;bestId=id}correct+=bestC;for(let j=0;j<n;j++)records[rp++]=ctx.charCodeAt(j)-1;records[rp++]=bestId}
   const top=correct/(chars.length-n);groups.push({count:contexts.length,records});totalR+=contexts.length;const zipped=await gz(buildRaw(n,top));self.postMessage({kind:'progress',n,top,size:zipped.length,states:totalR});
   if(zipped.length<=limit)best={n,top,size:zipped.length,states:totalR,buf:zipped.buffer};else if(best)break;
 }
 if(!best)throw Error('Schon das kleinste Modell überschreitet das Größenlimit.');self.postMessage({kind:'done',...best},[best.buf]);
}catch(err){self.postMessage({kind:'error',message:String(err.message||err)})}};`;
btn.onclick=()=>{if(!loadedText){status.textContent='Bitte zuerst eine Textdatei wählen.';return}btn.disabled=true;result.innerHTML='';bar.style.width='0';status.textContent='Kompiliere im Hintergrund …';const w=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'})));w.onmessage=ev=>{const x=ev.data;if(x.kind==='progress'){status.textContent=`max n=${x.n} · ${(x.top*100).toFixed(2)} % · ${(x.size/1024).toFixed(0)} KiB`;bar.style.width=Math.min(100,x.size/LIMIT*100)+'%'}else if(x.kind==='done'){const blob=new Blob([x.buf],{type:'application/gzip'}),url=URL.createObjectURL(blob),fn=loadedName+'-1mb.tm.gz';result.innerHTML=`<p class="good"><b>Fertig:</b> variable Ordnung 1…${x.n}, ${(x.top*100).toFixed(2)} % bei max n, ${(x.size/1024).toFixed(0)} KiB.</p><a class="btn" id="dl">${e(fn)} herunterladen</a>`;const a=document.getElementById('dl');a.href=url;a.download=fn;status.textContent='Fertig.';btn.disabled=false;w.terminate()}else{status.textContent='Fehler: '+x.message;btn.disabled=false;w.terminate()}};w.postMessage({text0:loadedText,name:loadedName,limit:LIMIT})};
</script></main></body></html>
